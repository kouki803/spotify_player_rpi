<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Spotify User Account</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Add New Spotify User Account</h1>
    <p>Enter a <strong>unique</strong> name for this user account (e.g., "My Account", "Family Member A").</p>
    <p>After submitting, you will be redirected to Spotify for authentication. Please log in and authorize the app.</p>
    <form action="{{ url_for('add_user_account') }}" method="post">
        <label for="user_name">User Account Name:</label><br>
        <input type="text" id="user_name" name="user_name" required><br><br>
        <button type="submit" class="primary-button">Start Authentication</button>
    </form>
    <a href="{{ url_for('index') }}" class="button">Back to Settings</a>
</body>
</html>
